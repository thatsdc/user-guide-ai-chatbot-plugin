name: Deploy Docs and PR Previews

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          # Install Sphinx and the theme
          pip install sphinx sphinx-rtd-theme

      - name: Build HTML documentation
        run: |
          # Build from docs/ to docs/html/
          sphinx-build -b html docs/ docs/html/
          
          # Create .nojekyll to prevent GitHub from ignoring Sphinx assets
          touch docs/html/.nojekyll

      # --- PRODUCTION DEPLOY (Executes only on push/merge to main) ---
      - name: Deploy Production Docs to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/html/

      # --- PR PREVIEW DEPLOY (Executes only inside a Pull Request) ---
      - name: Deploy PR Preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/deploy-pr-preview@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          source-dir: docs/html/